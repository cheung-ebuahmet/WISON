    retention_pct: null                  # tender stage — Source: SCS Clause 19
    defects_liability_months: null       # tender stage — Source: SCS Clause 27
    warranty_months: null                # tender stage — Source: SCS Clause 27
    payment_days: null                   # tender stage — Source: SCS Clause 19
    note_material_supply: >
      Source: 策划方案 §5 — Contractor (Wison) supplies raw materials to LONGTAIDI's China facility.
      LONGTAIDI processes under 来料加工 (processing trade) customs regime.
      This is a labor + services contract, not a material supply contract.
    note_payment_flow: >
      Source: 策划方案 §4 — Wison pays LONGTAIDI directly (required for customs/import-export and FX).
      Actual pricing settled between CCECC and LONGTAIDI — Wison facilitates payment.
      CCECC's MEI Pkg I contract scope is correspondingly reduced (descope of prefab works).

