contract:
  id: "99"
  name: "LONGTAIDI - Firefighting Pipe Prefabrication"
  type: subcontract
  status: tender                       # Issue for Inquiry stage — not yet awarded
  vendor: "LONGTAIDI"
  vendor_full: "沧州隆泰迪管道科技有限公司 (Cangzhou Longtaidi Pipeline Technology Co., Ltd.)"
  discipline: "Firefighting Pipe Prefabrication"
  package: "Fire Prefab (FOB)"
  contract_ref: null                   # not yet assigned (tender stage)
  parent_contract: "EPC-ADNOC-RSGP"
  execution_date: null
  revision: "Rev. A (Issue for Inquiry)"
  inquiry_date: "2026-06-30"
  note_contract_form: "SCS (Special Conditions of Subcontract) — MEI framework; unique Exh L (GTC of Purchase)"
  note_tripartite: >
    Tripartite arrangement: Wison supplies raw materials to LONGTAIDI in China;
    LONGTAIDI performs shop fabrication (NDE + hydrotest + coating) on FOB basis;
    Wison handles international shipping to UAE site;
    CCECC MEI Pkg I is the site installation subcontractor but lacked foreign-trade processing qualifications —
    LONGTAIDI was selected by CCECC as their prefabrication unit, requiring a direct contract with Wison
    for customs/import-export purposes. Actual settlement pricing negotiated between CCECC and LONGTAIDI.
  note_fob: >
    FOB (Free on Board) delivery: LONGTAIDI delivers to Wison-designated Chinese port.
    Wison handles international ocean freight + UAE inland transport.
    Pipe spools are flange-connection design — only fit-up at site, no field welding of 3"+ pipe.

  scope:
    description: "Fire-fighting Piping (3-inch and above) Prefabrication Works on FOB Basis"
    pipe_diameter_min: "3 inch (DN80)"
    connection_type: "Flanged (法兰连接)"

    # ——— 工程量 ———
    # 唯一权威数据源：策划方案 §1.3 招标工程量表 — 6.7万当量
    # 策划方案正文另有两个粗略估数（5.3万吋 / 1.26万米），但精度不可靠；
    # BOQ (Exh D) 明细仅 40,000 吋，同为 Inquiry 阶段估量。
    # 结论：三字段统一取 SOW 表格的 6.7万当量，BOQ 定稿/合同签订后回溯修正。
    equivalent_units: 67000              # 6.7万当量 — 策划方案 §1.3 表格（唯一权威值）
    welding_qty_dia_inch: 67000          # 统一取 6.7万（原 §3.1 粗估 5.3万吋，废弃）
    linear_meters: 67000                 # 统一取 6.7万（原 §1.3 粗估 1.26万米，废弃）
    pct_of_total_pipe_welding: 15        # 15% of project total pipe welding
    scope_includes:
      - "Shop fabrication of 3-inch+ firefighting pipe spools"
      - "NDE (Non-Destructive Examination)"
      - "Hydrostatic testing"
      - "Galvanizing (镀锌)"
      - "FBE anti-corrosion coating (熔结环氧粉末涂层)"
      - "Container packing per Wison shipping instructions"
      - "Land transport within China to Wison-designated port"
      - "Domestic customs clearance (出口报关)"
      - "Processing trade documentation (来料加工手册备案)"
      - "Free Trade Zone customs procedures (自贸区清关)"
    scope_excludes:
      - "Site installation (by CCECC MEI Pkg I)"
      - "Pipe support fabrication and installation"
      - "Field adjustment spools (预留调整段)"
      - "3-inch and below threaded connections (done at site)"
      - "International ocean freight (by Wison)"
      - "UAE inland transport (by Wison)"
    plant_units: ["30", "40"]

  structure:
