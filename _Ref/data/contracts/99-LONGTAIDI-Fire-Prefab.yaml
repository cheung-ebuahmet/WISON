      - {section: "§4 代为付款安排", content: "付款按合同协议执行"}
      - {section: "§5 承包商供货材料", content: "来料加工模式, Wison 供料"}
      - {section: "§6 物流海关", content: "FOB 中国港口, Wison 负责国际海运"}

