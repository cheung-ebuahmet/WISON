    note_payment_flow: >
      Wison pays LONGTAIDI directly (required for customs/import-export and FX).
      Actual pricing settled between CCECC and LONGTAIDI — Wison facilitates payment.
      CCECC's MEI Pkg I contract scope is correspondingly reduced (descope of prefab works).

