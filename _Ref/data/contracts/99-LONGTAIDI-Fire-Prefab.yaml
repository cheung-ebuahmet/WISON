        exists: true
        source: "Part II Exhibits of Subcontract Agreement/Exhibit J Scheduling and Reporting/"
        commercial_relevance: {level: high, reason: ["schedule"]}
        primary_topics: ["schedule", "reporting", "progress"]
      - exhibit_ref: "Exh K"
        title: "Owner's Special Requirements & Reference"
        exists: true
        source: "Part II Exhibits of Subcontract Agreement/Exhibit K Owner's Special Requirements & Reference/"
